# 1. 注入自建节点 (对应原订阅中的华为云节点)
proxies:
  - name: "🇭🇰 HK-华为云"
    type: vmess
    server: kougami.dedyn.io
    port: 443
    uuid: d94b5096-9796-455d-84c4-b9c5c963b1df
    alterId: 0
    cipher: auto
    network: ws
    ws-opts:
      path: /bxatwnvf
    tls: true
    udp: true

# 2. 策略组注入 (支持 filter 正则自动筛选机场节点)
proxy-groups:
