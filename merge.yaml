      - "🚀 节点选择"
      - "🚀 手动切换"
      - "DIRECT"

  # --- 核心主调度组 ---
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🚀 手动切换"
      - "DIRECT"
      - "🇸🇬狮城节点-自动"
      - "🇭🇰香港节点-自动"
